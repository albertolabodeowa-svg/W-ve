<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Profile - WAVE</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">

</head>


<body>

<header class="navbar">

    <a href="index.html" class="logo">
        WAVE
    </a>

    <nav>

        <a href="index.html">🏠</a>

        <a href="explore.html">🔍</a>

        <a href="reels.html">🎬</a>

        <a href="messages.html">💬</a>

    </nav>

</header>


<main class="profile-container">


    <section class="profile-header">


        <div class="profile-picture">

            👤

        </div>


        <div class="profile-info">

            <h2 id="profileUsername">
                Username
            </h2>


            <p id="profileBio">
                Welcome to my WAVE profile.
            </p>


            <button id="editProfileButton" onclick="editProfile()">
                Edit Profile
            </button>

            <button id="profileFollowButton" hidden>
                Follow
            </button>

            <a id="profileMessageLink" href="messages.html" hidden>
                Message
            </a>


            <button onclick="logout()">
                Log Out
            </button>

        </div>

    </section>



    <section class="profile-stats">

        <div>

            <strong id="postCount">
                0
            </strong>

            <span>
                Posts
            </span>

        </div>


        <div>

            <strong id="followerCount">
                0
            </strong>

            <span>
                Followers
            </span>

        </div>


        <div>

            <strong id="followingCount">
                0
            </strong>

            <span>
                Following
            </span>

        </div>

    </section>



    <section
        id="profilePosts"
        class="post-grid"
    ></section>

    <h3 class="profile-section-title">Reels</h3>

    <section
        id="profileReels"
        class="profile-reels"
    ></section>


</main>


<script src="js/storage.js"></script>
<script src="js/auth.js"></script>
<script src="js/profile.js"></script>

</body>

</html>
